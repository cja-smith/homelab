server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Fill in service links using the hostname from this request.
        sub_filter '__DASHBOARD_HOST__' '$host';
        sub_filter_once off;
    }
}
